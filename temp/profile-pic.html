<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: transparent; }
  .container {
    width: 400px;
    height: 400px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
  }
  .container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(255,165,0,0.15) 0%, transparent 50%);
  }
  .letter {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    font-size: 200px;
    font-weight: 800;
    color: transparent;
    background: linear-gradient(135deg, #FF6B00 0%, #FF9500 40%, #FFD700 100%);
    -webkit-background-clip: text;
    background-clip: text;
    position: relative;
    z-index: 1;
    letter-spacing: -8px;
  }
  .glow {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(255,149,0,0.3) 0%, transparent 70%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }
  .dots {
    position: absolute;
    bottom: 80px;
    display: flex;
    gap: 12px;
    z-index: 1;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #FF9500;
    border-radius: 50%;
    opacity: 0.6;
  }
  .dot:nth-child(2) { opacity: 0.8; }
  .dot:nth-child(3) { opacity: 1; }
</style>
</head>
<body>
  <div class="container">
    <div class="glow"></div>
    <span class="letter">H</span>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
