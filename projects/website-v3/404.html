<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Happy's Agents</title>
  <meta name="description" content="The page you're looking for doesn't exist.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦞%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-light: #1a1a1a;
      --text: #fafafa;
      --text2: #a3a3a3;
      --muted: #737373;
      --border: #262626;
      --accent: #dc4a3d;
      --accent-hover: #e85d4f;
      --font-mono: "SF Mono", "Monaco", "Inconsolata", "Fira Code", monospace;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
    }
    
    .container {
      max-width: 600px;
      text-align: center;
    }
    
    .logo {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3rem;
    }
    
    .error-code {
      font-family: var(--font-mono);
      font-size: 8rem;
      font-weight: 700;
      color: var(--surface-light);
      line-height: 1;
      margin-bottom: 1rem;
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 1rem;
      color: var(--text);
    }
    
    p {
      color: var(--text2);
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: white;
      padding: 0.875rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9375rem;
      transition: background 0.2s ease;
    }
    
    .cta:hover {
      background: var(--accent-hover);
    }
    
    .cta svg {
      width: 16px;
      height: 16px;
    }
    
    .footer {
      position: fixed;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    @media (max-width: 640px) {
      .error-code {
        font-size: 5rem;
      }
      
      h1 {
        font-size: 1.25rem;
      }
      
      p {
        font-size: 0.9375rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Happy's Agents</div>
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist. It might have been moved, deleted, or never existed in the first place.</p>
    <a href="/" class="cta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Back to homepage
    </a>
  </div>
  
  <div class="footer">AI Venture Studio — Built in Athens, Greece</div>
</body>
</html>
