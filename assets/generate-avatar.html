<!DOCTYPE html>
<html>
<body style="margin:0;background:#000">
<canvas id="c" width="800" height="800"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// Background - deep dark with subtle gradient
const bg = ctx.createRadialGradient(400, 400, 100, 400, 400, 500);
bg.addColorStop(0, '#1a1a2e');
bg.addColorStop(1, '#0a0a15');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, 800, 800);

// Outer glow ring
ctx.beginPath();
ctx.arc(400, 400, 300, 0, Math.PI * 2);
ctx.strokeStyle = '#FF4500';
ctx.lineWidth = 3;
ctx.shadowColor = '#FF4500';
ctx.shadowBlur = 40;
ctx.stroke();
ctx.shadowBlur = 0;

// Inner circle with gradient
const inner = ctx.createRadialGradient(400, 380, 50, 400, 400, 250);
inner.addColorStop(0, '#1e1e3a');
inner.addColorStop(1, '#0d0d1a');
ctx.beginPath();
ctx.arc(400, 400, 250, 0, Math.PI * 2);
ctx.fillStyle = inner;
ctx.fill();

// "H" letter - bold, geometric, modern
ctx.font = 'bold 320px "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';

// Text glow
ctx.shadowColor = '#FF4500';
ctx.shadowBlur = 30;
ctx.fillStyle = '#FF4500';
ctx.fillText('H', 400, 410);

// Bright overlay
ctx.shadowBlur = 0;
ctx.fillStyle = '#FF6B35';
ctx.fillText('H', 400, 408);

// Small "agent" text below
ctx.font = '500 48px "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
ctx.fillStyle = '#666';
ctx.letterSpacing = '8px';
ctx.fillText('AGENT', 400, 580);

// Subtle dot pattern overlay
for(let i = 0; i < 800; i += 20) {
  for(let j = 0; j < 800; j += 20) {
    const dist = Math.sqrt((i-400)**2 + (j-400)**2);
    if(dist < 350 && dist > 100) {
      ctx.fillStyle = `rgba(255,69,0,${0.02 * Math.random()})`;
      ctx.fillRect(i, j, 1, 1);
    }
  }
}
</script>
</body>
</html>
